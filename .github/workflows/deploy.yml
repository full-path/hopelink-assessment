name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # A repository *variable*, not a secret: this URL is compiled into the client bundle in
          # plaintext, so calling it a secret would imply a protection that does not exist.
          # Unset is a valid state — the site builds and deploys with commenting disabled.
          # See apps-script/README.md.
          VITE_COMMENTS_ENDPOINT: ${{ vars.COMMENTS_ENDPOINT }}
          # The live Google Sheet's "Publish to web" link — also a variable, also public by
          # construction. Its tabs are identified in src/sheetTabs.ts. Unset, the site shows the
          # committed snapshot only. See README "Live data from a Google Sheet".
          VITE_SHEET_PUBLISHED_URL: ${{ vars.SHEET_PUBLISHED_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
